services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: reloadcars-postgres
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: reloadcars
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/99-test-database.sql

volumes:
  postgres-data:
